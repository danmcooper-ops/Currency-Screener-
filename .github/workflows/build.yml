name: Build and publish currency screener

# Builds the report and deploys it straight to GitHub Pages in one job.
#
# An earlier version split this in two — build pushed a `pages-live` branch
# and a second workflow deployed on push to it. That chain cannot work:
# push-triggered workflows are read from the *pushed branch's* tree, and
# `pages-live` holds only docs/, so there was no workflow file there to run.
# Deploying the artifact directly removes the coupling entirely.
#
# `pages-live` is still updated, but only as a fallback: it lets Pages serve
# the site via Settings > Pages > "Deploy from a branch" without Actions
# running at all. Nothing in this workflow depends on it.

on:
  schedule:
    # 06:20 UTC daily. After the previous day's ECB reference rates are out
    # (published ~16:00 CET) and off the top of the hour, where scheduled
    # runners queue worst.
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'models/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # Upstream responses are cached on disk by data/cache.py. Restoring the
      # cache means a World Bank outage on build day is served from the last
      # good response instead of emptying the External pillar — the same
      # stale-serve path the clients use locally.
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Build report
        run: python scripts/analyze_currencies.py

      - name: Gate coverage report
        run: python scripts/gate_coverage.py output/results_*.json

      - name: Stage docs
        run: python scripts/publish_pages.py

      # `enablement: true` can only create the Pages site if the token is
      # allowed to; on a repository where Pages has never been turned on it
      # fails with "Resource not accessible by integration". That is a
      # one-time owner action (Settings > Pages), so it must not fail the
      # build — the report is still built and mirrored below.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Pages not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages not enabled::Built the report but \
          could not deploy. Enable Pages once at Settings > Pages (set Source \
          to 'GitHub Actions'), then re-run this workflow. Until then the \
          latest report is on the pages-live branch under docs/."

      # Archival copy. Single-commit orphan branch, force-pushed each run, so
      # the ~660 KB daily report never accumulates in git history. Runs even
      # when the deploy was skipped, so pages-live is always the current
      # report and can serve the site via "Deploy from a branch".
      - name: Mirror to pages-live
        if: always()
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r docs/. "$tmp/"
          git checkout --orphan pages-live
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf docs && mkdir -p docs
          cp -r "$tmp/." docs/
          git add -f docs
          git commit -m "Publish currency screener $(date -u +%Y-%m-%d)"
          git push -f origin pages-live
